name: Build Custom Forge 1.8.9

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Validate JSON files
        run: |
          python3 -c "
import json, sys
for f in ['forge/jsons/1.8.9-dev.json', 'forge/jsons/1.8.9-rel.json']:
    data = json.load(open(f))
    if 'inheritsFrom' in data:
        print(f'ERROR: {f} contains inheritsFrom - must be self-contained')
        sys.exit(1)
    if 'forgemodifier' in str(data):
        print(f'ERROR: {f} contains forgemodifier - invalid')
        sys.exit(1)
    if 'jar' in data:
        print(f'ERROR: {f} contains jar field - must be self-contained')
        sys.exit(1)
    print(f'OK: {f} is valid and self-contained')
"

      - name: Prepare Minecraft version cache
        run: |
          # ForgeGradle 2.1 needs the vanilla 1.8.9 version.json in the cache
          # for native library resolution
          mkdir -p ~/.gradle/caches/minecraft/versions/1.8.9
          if [ -f "forge/jsons/1.8.9.json" ]; then
            cp forge/jsons/1.8.9.json ~/.gradle/caches/minecraft/versions/1.8.9/1.8.9.json
            echo "Copied 1.8.9.json to Gradle cache"
          else
            echo "ERROR: forge/jsons/1.8.9.json not found"
            exit 1
          fi

      - name: Setup Gradle Wrapper
        working-directory: forge
        run: chmod +x gradlew

      - name: Setup CI Workspace
        working-directory: forge
        env:
          ORG_GRADLE_PROJECT_org_gradle_jvmargs: -Xmx3G -XX:MaxPermSize=512m
        run: ./gradlew setupCIWorkspace --no-daemon --stacktrace

      - name: Build
        working-directory: forge
        env:
          ORG_GRADLE_PROJECT_org_gradle_jvmargs: -Xmx3G -XX:MaxPermSize=512m
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.8.9-build
          path: forge/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Version JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.8.9-json
          path: forge/build/jsons/*.json
          if-no-files-found: ignore